<!DOCTYPE html>
<!-- lang is corrected to the chosen locale before the intro paints; see applyLocale(). -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>Majhong2</title>
<!-- Home-screen label and standalone launch for iOS; the manifest covers the rest. -->
<meta name="apple-mobile-web-app-title" content="青雀">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
html, body {
	width: 100%;
	height: 100%;
}
body {
	color: #164d3e;
	/* Letterbox / page chrome — sampled to match perceived intro paper. */
	background-color: #ede7d8;
	overflow: hidden;
	touch-action: none;
}
/* Fills the window in any orientation. It is never CSS-rotated: Godot maps taps
   from getBoundingClientRect() and clientX/Y, which ignore transforms, so a rotated
   canvas sends every tap to the wrong place. Landscape comes from the PWA. */
#app-root {
	position: fixed;
	left: 0;
	top: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: #ede7d8;
}
#canvas {
	display: block;
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
}
#canvas:focus {
	outline: none;
}

#intro-overlay {
	position: absolute;
	inset: 0;
	z-index: 20;
	display: flex;
	align-items: center;
	justify-content: center;
	background: #ede7d8;
	pointer-events: auto;
}
#stage-frame {
	width: 1920px;
	height: 1080px;
	transform-origin: center center;
	flex-shrink: 0;
}
#stage {
	position: relative;
	width: 1920px;
	height: 1080px;
	overflow: hidden;
	color: #164d3e;
	font-family: Garamond, "Palatino Linotype", Palatino, "Times New Roman", Times, serif;
	background: #ede7d8;
}
.clip { position: absolute; inset: 0; width: 100%; height: 100%; }
.paper {
	position: absolute; inset: 0;
	background: radial-gradient(ellipse at 48% 43%, #fffdf4 0%, #f5f0e3 54%, #e5dcc6 100%);
}
.silk {
	position: absolute; inset: 0; opacity: .16;
	background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(115, 89, 41, .1) 3px 4px);
	mix-blend-mode: multiply;
}
.wash {
	position: absolute; inset: 0;
	background:
		radial-gradient(ellipse at 16% 63%, rgba(49, 112, 87, .1), transparent 34%),
		radial-gradient(ellipse at 86% 40%, rgba(64, 126, 94, .13), transparent 33%);
}
.border {
	position: absolute; inset: 62px;
	border: 1px solid rgba(158, 132, 77, .24);
}
.border:before, .border:after {
	content: "";
	position: absolute; width: 9px; height: 9px;
	background: #b69a5d; transform: rotate(45deg); top: -5px; opacity: .6;
}
.border:before { left: 26px; }
.border:after { right: 26px; }
.corner-lines {
	position: absolute; inset: 86px;
	border-top: 1px solid rgba(182, 154, 93, .08);
	border-bottom: 1px solid rgba(182, 154, 93, .08);
}
.world { position: absolute; inset: 0; transform-origin: 50% 50%; }
.halo {
	position: absolute; left: 570px; top: 144px; width: 780px; height: 780px;
	border: 1px solid rgba(158, 132, 77, .24); border-radius: 50%;
	box-shadow: 0 0 0 22px rgba(255, 253, 244, .28), 0 0 0 23px rgba(158, 132, 77, .075);
}
.halo:before {
	content: "";
	position: absolute; inset: 32px;
	border: 1px solid rgba(158, 132, 77, .1); border-radius: 50%;
}
.landscape { position: absolute; inset: 0; opacity: .26; }
.tile {
	position: absolute; width: 196px; height: 272px; border-radius: 16px;
	background: #174f3e; border: 1px solid #557962;
	box-shadow: 4px 11px 0 #174a3b, 7px 18px 0 rgba(15, 60, 44, .9), 12px 40px 36px rgba(76, 69, 41, .19);
	padding: 7px 7px 12px; transform-origin: 50% 60%;
}
.tile:after {
	content: "";
	position: absolute; inset: 5px 5px 11px; border-radius: 12px;
	border: 1px solid rgba(255, 255, 255, .9); pointer-events: none;
}
.tile img {
	width: 100%; height: 100%; object-fit: contain; display: block;
	border-radius: 10px; box-shadow: inset 0 0 0 1px #dbccac;
}
.tile-face {
	overflow: hidden; border-radius: 11px; width: 100%; height: 100%;
	background: #fff7dc; box-shadow: 0 2px 3px rgba(255, 255, 255, .8);
}
.tile-shine {
	position: absolute; inset: 7px 7px 12px; border-radius: 11px;
	background: linear-gradient(125deg, rgba(255, 255, 255, .3), transparent 40%, rgba(134, 105, 47, .08));
	pointer-events: none;
}
.t1 { left: 135px; top: 380px; z-index: 1; }
.t2 { left: 267px; top: 455px; z-index: 2; }
.t3 { left: 397px; top: 574px; z-index: 3; }
.t4 { left: 1589px; top: 329px; z-index: 1; }
.t5 { left: 1460px; top: 406px; z-index: 2; }
.t6 { left: 1327px; top: 529px; z-index: 3; }
.title-layout {
	position: absolute; inset: 0;
	display: flex; flex-direction: column; align-items: center; justify-content: center;
	padding-bottom: 12px; gap: 25px;
}
.top-ornament {
	height: 40px; display: flex; align-items: center; gap: 15px;
	color: #927638; font-size: 16px; opacity: 0;
}
.top-ornament:before, .top-ornament:after {
	content: ""; width: 45px; height: 1px;
	background: linear-gradient(90deg, transparent, #b69a5d);
}
.top-ornament:after { transform: rotate(180deg); }
.diamond {
	width: 7px; height: 7px; border: 1px solid #a1874e; transform: rotate(45deg);
}
.title-mask {
	position: relative; overflow: hidden; padding: 8px 0 15px; opacity: 0; line-height: 0;
}
.title {
	display: block; width: 510px; height: 253px; margin: 0; padding: 0; border: 0;
}
.shimmer {
	position: absolute; left: 0; top: 8px; width: 510px; height: 253px; pointer-events: none;
	background-image: linear-gradient(
		110deg,
		transparent 0%, transparent 40%,
		rgba(182, 154, 93, .6) 47%, #d8c58c 50%, rgba(182, 154, 93, .72) 53%,
		transparent 60%, transparent 100%
	);
	background-position: 100% 50%; background-size: 300% 100%; background-repeat: no-repeat;
	-webkit-mask-image: url(intro-assets/title-qingque.png);
	mask-image: url(intro-assets/title-qingque.png);
	-webkit-mask-size: 100% 100%; mask-size: 100% 100%;
	-webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
}
.gold-line {
	height: 1px; width: 156px; background: #aa8d50; transform: scaleX(0); position: relative;
}
.gold-line:after {
	content: "";
	position: absolute; width: 5px; height: 5px; left: 76px; top: -2px;
	background: #aa8d50; transform: rotate(45deg);
}
.subtitle {
	font-family: Garamond, "Palatino Linotype", Palatino, "Times New Roman", Times, serif;
	font-size: 27px; letter-spacing: 12px; padding-left: 12px;
	color: #6c714f; margin: 5px 0 0; opacity: 0;
}
.loading-label {
	font-family: Garamond, "Palatino Linotype", Palatino, "Times New Roman", Times, serif;
	font-size: 21px; letter-spacing: 7px; padding-left: 7px;
	color: #6c714f; margin: 10px 0 0; opacity: 0; visibility: hidden;
}
.mote {
	position: absolute; border-radius: 50%; background: #a28236;
	box-shadow: 0 0 9px rgba(182, 154, 93, .3);
}
.bottom-mark {
	position: absolute; left: 50%; bottom: 79px; width: 1px; height: 27px;
	background: linear-gradient(#ad935a, transparent); opacity: 0;
}

/* Install offer for mobile browsers. Lives outside the scaled 1920×1080 stage so
   the buttons keep a real 44px touch height on a phone. */
#install-gate {
	position: absolute;
	z-index: 25;
	left: 0;
	right: 0;
	bottom: max(18px, env(safe-area-inset-bottom, 0px));
	padding: 0 16px;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 10px;
	font-family: Garamond, "Palatino Linotype", Palatino, "Times New Roman", Times, serif;
	color: #164d3e;
}
#install-gate[hidden] {
	display: none !important;
}
.gate-lead {
	margin: 0;
	font-size: 15px;
	letter-spacing: 2px;
	color: #6c714f;
	text-align: center;
}
.gate-actions {
	display: flex;
	flex-wrap: wrap;
	justify-content: center;
	gap: 12px;
}
.gate-btn {
	min-width: 150px;
	min-height: 44px;
	padding: 0 22px;
	border-radius: 8px;
	font: inherit;
	font-size: 17px;
	letter-spacing: 2px;
	cursor: pointer;
	-webkit-tap-highlight-color: transparent;
	touch-action: manipulation;
}
.gate-btn.primary {
	background: #174f3e;
	color: #fff7dc;
	border: 1px solid #557962;
	box-shadow: 0 3px 0 #0f3c2c, 0 8px 18px rgba(76, 69, 41, 0.18);
}
.gate-btn.primary:active {
	transform: translateY(2px);
	box-shadow: 0 1px 0 #0f3c2c, 0 4px 10px rgba(76, 69, 41, 0.18);
}
.gate-btn.secondary {
	background: rgba(237, 231, 216, 0.94);
	color: #164d3e;
	border: 1px solid rgba(158, 132, 77, 0.45);
}
.gate-btn.secondary:active {
	background: #e5dcc6;
}

#boot-error {
	display: none;
	position: absolute;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%);
	max-width: min(520px, 86vw);
	padding: 1.1rem 1.25rem;
	background: #5b3943;
	border: 1px solid #9b3943;
	border-radius: .5rem;
	color: #e0e0e0;
	font-family: "Noto Sans", "Droid Sans", Arial, sans-serif;
	font-size: 15px;
	line-height: 1.4;
	text-align: center;
	z-index: 30;
}
#boot-error.is-visible { display: block; }
</style>

<body>
<div id="app-root">
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>

<div id="intro-overlay" aria-hidden="false">
	<div id="stage-frame">
		<div id="stage">
			<div class="clip">
				<div class="paper"></div>
				<div class="silk"></div>
				<div class="wash"></div>
				<div class="border"></div>
				<div class="corner-lines"></div>
				<div class="world">
					<div class="halo"></div>
					<svg class="landscape" viewBox="0 0 1920 1080" fill="none" aria-hidden="true">
						<g stroke="#8f9f78" stroke-width="1">
							<path d="M0 897 Q150 815 268 849T516 849T783 892T1082 891T1421 848T1718 867T1920 811" />
							<path d="M0 920 Q171 857 325 890T697 921T1070 930T1465 882T1920 850" />
							<path d="M0 947 Q251 898 431 932T890 956T1370 915T1920 900" />
						</g>
					</svg>
					<div class="tile t1"><div class="tile-face"><img src="intro-assets/tiles/face_27.png" alt=""></div><div class="tile-shine"></div></div>
					<div class="tile t2"><div class="tile-face"><img src="intro-assets/tiles/face_09.png" alt=""></div><div class="tile-shine"></div></div>
					<div class="tile t3"><div class="tile-face"><img src="intro-assets/tiles/face_00.png" alt=""></div><div class="tile-shine"></div></div>
					<div class="tile t4"><div class="tile-face"><img src="intro-assets/tiles/face_32.png" alt=""></div><div class="tile-shine"></div></div>
					<div class="tile t5"><div class="tile-face"><img src="intro-assets/tiles/face_31.png" alt=""></div><div class="tile-shine"></div></div>
					<div class="tile t6"><div class="tile-face"><img src="intro-assets/tiles/face_18.png" alt=""></div><div class="tile-shine"></div></div>
					<div class="title-layout">
						<div class="top-ornament"><span class="diamond"></span></div>
						<div class="title-mask" id="title-reveal">
							<img class="title" id="hero-title" src="intro-assets/title-qingque.png" width="510" height="253" alt="">
							<div class="shimmer" aria-hidden="true"></div>
						</div>
						<div class="gold-line"></div>
						<p class="subtitle" id="subtitle">MAHJONG</p>

		</div>
	</div>
</div>
</div>

<!-- Outside #app-root, so its dialog sits over the page rather than inside the
     game's stacking context. Manual mode: it only opens from the Install button. -->
<pwa-install
	id="pwa-install"
	manual-apple
	manual-chrome
	disable-screenshots
	manifest-url="index.manifest.json">
</pwa-install>

<script src="intro-assets/intro-i18n.js"></script>
<script src="intro-assets/gsap.min.js"></script>
<script src="intro-assets/pwa-install.bundle.js"></script>
<script src="index.js"></script>
<script>
(function () {
	const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":8686952,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
	const GODOT_THREADS_ENABLED = false;
	const engine = new Engine(GODOT_CONFIG);
	const overlay = document.getElementById("intro-overlay");
	const stageFrame = document.getElementById("stage-frame");
	const loadingLabel = document.getElementById("loading-label");
	const bootError = document.getElementById("boot-error");
	const canvas = document.getElementById("canvas");
	const installGate = document.getElementById("install-gate");
	const installer = document.getElementById("pwa-install");

	// --- Language ---------------------------------------------------------------
	// The loading screen has to choose a language before Godot exists, so it reads
	// the same namespaced localStorage key the game writes and falls back to the
	// browser's own language. Strings come from locale/*.po via intro-i18n.js.
	const STRINGS = window.QINGQUE_I18N || {};
	const LOCALE_KEY = window.QINGQUE_LOCALE_KEY || "qingque.locale";

	function pickLocale() {
		let stored = null;
		try {
			stored = window.localStorage.getItem(LOCALE_KEY);
		} catch (err) {}
		if (stored && STRINGS[stored]) {
			return stored;
		}
		const preferred = navigator.languages || [navigator.language || ""];
		for (let i = 0; i < preferred.length; i++) {
			if (String(preferred[i]).toLowerCase().indexOf("zh") === 0) {
				return "zh_CN";
			}
		}
		return STRINGS.en ? "en" : "zh_CN";
	}

	const locale = pickLocale();
	const text = STRINGS[locale] || {};

	function applyLocale() {
		if (text.lang) {
			document.documentElement.lang = text.lang;
		}
		loadingLabel.textContent = text.loading || "";
		document.getElementById("install-lead").textContent = text["install.lead"] || "";
		document.getElementById("install-btn").textContent = text["install.button"] || "Install App";
		document.getElementById("browser-btn").textContent = text["install.browser"] || "Play in Browser";
		const subtitle = document.getElementById("subtitle");
		if (subtitle && text.subtitle) {
			subtitle.textContent = text.subtitle;
		}
		const heroTitle = document.getElementById("hero-title");
		if (heroTitle && text.title_alt) {
			heroTitle.alt = text.title_alt;
		}
	}

	// --- Intro stage scaling ---------------------------------------------------
	// The intro is authored at 1920×1080 and scaled to fit the window as it is,
	// portrait included; Godot's canvas follows the window on its own. A player who
	// wants landscape without browser chrome installs the PWA.
	function fitStage() {
		const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
		stageFrame.style.transform = "scale(" + scale + ")";
	}

	fitStage();
	window.addEventListener("resize", fitStage);

	// --- Install offer ---------------------------------------------------------
	// A phone browser's toolbars eat most of a landscape viewport, so a mobile
	// visitor who is not already inside the installed app is offered an install at
	// the end of the intro instead of being handed the game. The engine does not
	// start downloading until they choose to play here: an iOS home-screen app keeps
	// its own storage, so bytes fetched in Safari are wasted on anyone who installs.
	// The per-browser install flow (prompt vs. Share-sheet steps) is <pwa-install>'s.
	function isMobileDevice() {
		if (navigator.userAgentData && navigator.userAgentData.mobile) {
			return true;
		}
		const ua = navigator.userAgent || "";
		if (/Android|iPhone|iPad|iPod|Mobile/i.test(ua)) {
			return true;
		}
		// iPadOS Safari reports a desktop Mac user agent.
		return /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
	}

	function isInstalledApp() {
		const modes = ["fullscreen", "standalone", "minimal-ui"];
		for (let i = 0; i < modes.length; i++) {
			if (window.matchMedia("(display-mode: " + modes[i] + ")").matches) {
				return true;
			}
		}
		return navigator.standalone === true;
	}

	const offerInstall = isMobileDevice() && !isInstalledApp();

	function showInstallGate() {
		if (!installGate.hidden) {
			return;
		}
		installGate.hidden = false;
		gsap.fromTo(installGate, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" });
	}

	document.getElementById("install-btn").addEventListener("click", function (event) {
		event.preventDefault();
		if (installer && typeof installer.showDialog === "function") {
			installer.showDialog(true);
		}
	});
	document.getElementById("browser-btn").addEventListener("click", function (event) {
		event.preventDefault();
		installGate.hidden = true;
		bootEngine();
		tryHandoff();
	});

	applyLocale();

	let introDone = false;
	let godotReady = false;
	let handedOff = false;
	let loadingTween = null;

	function showLoading() {
		if (loadingLabel.style.visibility === "visible") {
			return;
		}
		loadingLabel.style.visibility = "visible";
		gsap.killTweensOf(loadingLabel);
		gsap.set(loadingLabel, { opacity: 0.28 });
		loadingTween = gsap.to(loadingLabel, {
			opacity: 0.82,
			duration: 1.15,
			ease: "sine.inOut",
			yoyo: true,
			repeat: -1,
		});
	}

	function hideLoading() {
		if (loadingTween) {
			loadingTween.kill();
			loadingTween = null;
		}
		gsap.killTweensOf(loadingLabel);
		gsap.set(loadingLabel, { opacity: 0, visibility: "hidden" });
	}

	function handoffToGame() {
		if (handedOff) {
			return;
		}
		handedOff = true;
		hideLoading();
		overlay.setAttribute("aria-hidden", "true");
		gsap.to(overlay, {
			opacity: 0,
			duration: 0.65,
			ease: "sine.inOut",
			onComplete: function () {
				overlay.remove();
				try {
					canvas.focus();
				} catch (err) {}
			},
		});
	}

	function tryHandoff() {
		if (handedOff) {
			return;
		}
		if (!introDone) {
			return;
		}
		if (!engineStarted) {
			showInstallGate();
			return;
		}
		if (!godotReady) {
			showLoading();
			return;
		}
		handoffToGame();
	}

	function markGodotReady() {
		requestAnimationFrame(function () {
			requestAnimationFrame(function () {
				godotReady = true;
				tryHandoff();
			});
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		let message = text["error.unknown"] || "An unknown error occurred.";
		if (err instanceof Error) {
			message = err.message;
		} else if (typeof err === "string") {
			message = err;
		}
		bootError.textContent = message;
		bootError.classList.add("is-visible");
		hideLoading();
	}

	// --- Intro timeline (same remap as HyperFrames source: choreography → 4s) ---
	const mapT = function (t) {
		return t <= 5 ? t / 2 : 2.5 + (t - 5) / 4;
	};
	const at = function (t) {
		return mapT(t);
	};
	const dur = function (start, length) {
		return mapT(start + length) - mapT(start);
	};

	const tl = gsap.timeline({
		paused: true,
		onComplete: function () {
			introDone = true;
			tryHandoff();
		},
	});

	tl.fromTo(".wash", { opacity: 0 }, { opacity: 1, duration: dur(0, 3.5), ease: "sine.out" }, at(0));
	tl.fromTo(".halo", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: dur(0.15, 3.3), ease: "power2.out" }, at(0.15));

	const tilePoses = [
		[-20, -730, 0.25],
		[-11, -910, 0.45],
		[4, -1110, 0.65],
		[19, 720, 0.35],
		[10, 900, 0.55],
		[-5, 1110, 0.75],
	];
	tilePoses.forEach(function (pose, i) {
		const r = pose[0];
		const x = pose[1];
		const start = pose[2];
		const selector = ".t" + (i + 1);
		tl.fromTo(
			selector,
			{ x: x, y: 42, rotation: r + (x < 0 ? -9 : 9), opacity: 1 },
			{ x: 0, y: 0, rotation: r, opacity: 1, duration: dur(start, 2.35), ease: "power3.out" },
			at(start)
		);
	});

	tl.fromTo(
		"#title-reveal",
		{ opacity: 0, clipPath: "inset(100% 0% 0% 0%)" },
		{ opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: dur(3, 1.6), ease: "power3.out" },
		at(3)
	);
	tl.fromTo(".title", { y: 18 }, { y: 0, duration: dur(3, 1.6), ease: "power3.out" }, at(3));
	tl.fromTo(".top-ornament", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: dur(3.8, 1.2), ease: "power2.out" }, at(3.8));
	tl.fromTo(".gold-line", { scaleX: 0 }, { scaleX: 1, duration: dur(4.1, 1.2), ease: "power2.inOut" }, at(4.1));
	tl.fromTo(".subtitle", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: dur(4.65, 1.15), ease: "power3.out" }, at(4.65));
	tl.fromTo(".bottom-mark", { opacity: 0 }, { opacity: 0.6, duration: dur(4.7, 1.5), ease: "sine.out" }, at(4.7));
	tl.fromTo(".shimmer", { backgroundPosition: "100% 50%" }, { backgroundPosition: "0% 50%", duration: dur(8, 1.4), ease: "sine.inOut" }, at(8));
	tl.fromTo(".world", { scale: 1 }, { scale: 1.025, duration: dur(6, 5), ease: "sine.inOut" }, at(6));

	const field = document.getElementById("particles");
	for (let i = 0; i < 34; i++) {
		const dot = document.createElement("i");
		dot.className = "mote";
		const px = 110 + ((i * 337) % 1700);
		const py = 110 + ((i * 191) % 820);
		const size = 1.5 + (i % 4) * 0.65;
		dot.style.cssText = "left:" + px + "px;top:" + py + "px;width:" + size + "px;height:" + size + "px;opacity:0;";
		field.appendChild(dot);
		tl.fromTo(
			dot,
			{ opacity: 0 },
			{ opacity: 0.13 + (i % 5) * 0.045, duration: dur(0.12 + (i % 7) * 0.13, 1.4 + (i % 3) * 0.3), ease: "sine.out" },
			at(0.12 + (i % 7) * 0.13)
		);
		tl.fromTo(
			dot,
			{ y: 12, x: 0 },
			{ y: -45 - (i % 4) * 18, x: (i % 2 ? 1 : -1) * (12 + (i % 6) * 3), duration: dur(0, 11), ease: "none" },
			at(0)
		);
	}

	tl.play(0);

	// --- Godot boot: in parallel with the intro, or on "Play in Browser" --------
	let engineStarted = false;

	function bootEngine() {
		if (engineStarted) {
			return;
		}
		engineStarted = true;

		const missing = Engine.getMissingFeatures({
			threads: GODOT_THREADS_ENABLED,
		});

		function missingFeaturesMessage() {
			const heading = text["error.missing_features"] || "Missing browser features:";
			return heading + "\n" + missing.join("\n");
		}

		if (missing.length !== 0) {
			if (
				GODOT_CONFIG["serviceWorker"] &&
				GODOT_CONFIG["ensureCrossOriginIsolationHeaders"] &&
				"serviceWorker" in navigator
			) {
				let serviceWorkerRegistrationPromise;
				try {
					serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
				} catch (err) {
					serviceWorkerRegistrationPromise = Promise.reject(new Error("Service worker registration failed."));
				}
				Promise.race([
					serviceWorkerRegistrationPromise
						.then(function (registration) {
							if (registration != null) {
								return Promise.reject(new Error("Service worker already exists."));
							}
							return registration;
						})
						.then(function () {
							return engine.installServiceWorker();
						}),
					new Promise(function (resolve) {
						setTimeout(resolve, 2000);
					}),
				])
					.then(function () {
						window.location.reload();
					})
					.catch(function (err) {
						console.error("Error while registering service worker:", err);
						displayFailureNotice(missingFeaturesMessage());
					});
			} else {
				displayFailureNotice(missingFeaturesMessage());
			}
			return;
		}

		engine
			.startGame({
				canvas: canvas,
				onProgress: function () {
					/* progress is absorbed by the intro / Loading label */
				},
			})
			.then(markGodotReady, displayFailureNotice);
	}

	if (!offerInstall) {
		bootEngine();
	}
})();
</script>
